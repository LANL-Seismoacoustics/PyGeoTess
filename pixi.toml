[workspace]
authors = ["Jonathan MacCarthy <jkmacc@lanl.gov>"]
channels = ["conda-forge"]
name = "pygeotess"
platforms = ["osx-arm64"]
version = "0.1.0"


[dependencies]
geotesscpp = ">=2.7"
numpy = ">=2.5.2,<3"
cython = "3.*"
python = "*"

[environments.dev.pypi-dependencies]
setuptools = ">=84.0.0, <85"
pytest = ">=9.1.1, <10"
pytest-memray = ">=1.10.0, <2"
make = ">=0.1.6.post2, <0.2"
myst-parser = ">=5.1.0, <6"
pydata-sphinx-theme = ">=0.21.0, <0.22"
sphinx = ">=5"
sphinx-book-theme = ">=1.1.3, <2"
sphinx-autobuild = ">=2025.8.25, <2026"
pip = ">=26.2.1, <27"
pygeotess = { path = ".", editable = true }

[environments.dev.dependencies]
compilers = ">=2.0.0,<3"



[tasks]
build = "python setup.py build_ext --inplace"
test = { depends-on = ["build"], cmd = "pytest -v" }
